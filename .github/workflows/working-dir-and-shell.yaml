name: Working DIR and Shell
on: [push]
defaults:
  run:
    shell: bash
jobs:
  display_wd-info-ubun2:
    runs-on: ubuntu-latest
    steps:
      - name: Display working directory and List files
        run: |
          pwd
          ls -a
          echo $GITHUB_SHA
          echo $GITHUB_REPOSITORY
          echo $GITHUB_WORKSPACE
  display_wd-info-window:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Display working directory and List files
        run: |
          Get-Location
          dir
          echo $env:GITHUB_SHA
          echo $env:GITHUB_REPOSITORY
          echo $env:GITHUB_WORKSPACE
